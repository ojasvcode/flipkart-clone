<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — Flipkart</title>
  <meta name="description" content="Review your cart and place your order on Flipkart. Best prices with free delivery." />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/cart.css" />
</head>
<body>

  <header id="main-header"></header>

  <main class="page-content">
    <div class="container">

      <!-- Breadcrumb -->
      <div style="padding:8px 0 12px;font-size:13px;color:#878787">
        <a href="index.html" style="color:var(--primary)">Home</a> &rsaquo;
        <span>Cart</span>
      </div>

      <!-- Progress steps -->
      <div style="background:white;border-radius:4px;padding:16px 24px;margin-bottom:12px;box-shadow:var(--card-shadow)">
        <div style="display:flex;align-items:center;gap:0">
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:28px;height:28px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">1</div>
            <span style="font-size:14px;font-weight:700;color:var(--primary)">Cart</span>
          </div>
          <div style="flex:1;height:2px;background:var(--border);margin:0 16px"></div>
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:28px;height:28px;border-radius:50%;background:#e0e0e0;color:#878787;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">2</div>
            <span style="font-size:14px;color:#878787">Address</span>
          </div>
          <div style="flex:1;height:2px;background:var(--border);margin:0 16px"></div>
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:28px;height:28px;border-radius:50%;background:#e0e0e0;color:#878787;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">3</div>
            <span style="font-size:14px;color:#878787">Payment</span>
          </div>
        </div>
      </div>

      <div class="cart-layout">
        <div id="cart-content"></div>
        <div id="price-summary" class="price-summary"></div>
      </div>

    </div>
  </main>

  <footer id="main-footer"></footer>
  <div id="toast-container"></div>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/header.js"></script>
  <script src="js/cart-page.js"></script>
</body>
</html>
