<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Category — Flipkart</title>
  <meta name="description" content="Browse and filter products by category. Best prices with free delivery on Flipkart." />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/category.css" />
</head>
<body>

  <header id="main-header"></header>

  <main class="page-content">
    <div class="container">

      <div style="padding:8px 0 12px;font-size:13px;color:#878787">
        <a href="index.html" style="color:var(--primary)">Home</a> &rsaquo;
        <span id="page-title">Category</span>
      </div>

      <div class="category-layout">

        <!-- Filter Sidebar -->
        <aside id="filter-sidebar" class="filter-sidebar"></aside>

        <!-- Products Area -->
        <div class="products-area">
          <!-- Sort Bar -->
          <div class="sort-bar" id="sort-bar"></div>
          <!-- Result info -->
          <div class="result-info" id="result-info"></div>
          <!-- Products Grid -->
          <div class="category-products" id="products-grid"></div>
          <!-- Pagination -->
          <div class="pagination" id="pagination"></div>
        </div>

      </div>
    </div>
  </main>

  <footer id="main-footer"></footer>
  <div id="toast-container"></div>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/header.js"></script>
  <script src="js/category.js"></script>
</body>
</html>
